# Open Space Support — static site
[build]
  command = "test -f js/supabase-config.js || cp js/supabase-config.example.js js/supabase-config.js"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
